version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      maven:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Stay on the Maven 3.9.x line; 3.10 is not the plugin baseline yet
      - dependency-name: "org.apache.maven:maven-artifact"
        versions: [">= 3.10.0"]
      - dependency-name: "org.apache.maven:maven-core"
        versions: [">= 3.10.0"]
      - dependency-name: "org.apache.maven:maven-model"
        versions: [">= 3.10.0"]
      - dependency-name: "org.apache.maven:maven-plugin-api"
        versions: [">= 3.10.0"]
      - dependency-name: "org.apache.maven:maven-repository-metadata"
        versions: [">= 3.10.0"]
      - dependency-name: "org.apache.maven:maven-resolver-provider"
        versions: [">= 3.10.0"]
      - dependency-name: "org.apache.maven:maven-settings"
        versions: [">= 3.10.0"]
      # Jetty >=10 requires Java 11+
      - dependency-name: "org.eclipse.jetty:*"
        versions: [">= 10.0"]
      # The resolver line has to match mavenVersion: maven-resolver-provider
      # 3.9.x pins resolver 1.9 transitively, and the supplier artifact is
      # renamed across the boundary.
      - dependency-name: "org.apache.maven.resolver:*"
        versions: [">= 2.0"]
      # plexus-xml 4.x depends on the Maven 4 XML API
      - dependency-name: "org.codehaus.plexus:plexus-xml"
        versions: [">= 4.0.0"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns: ["*"]
